<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Форма заявки</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <script src="js/validation.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="logo" href="index.html">Учебный магазин</a>
        <nav class="site-nav">
          <a href="index.html">Главная</a><a href="catalog.html">Каталог</a
          ><a href="cart.html">Корзина</a><a href="order.html">Заявка</a
          ><a href="contacts.html">Контакты</a>
        </nav>
      </div>
    </header>
    <main class="section">
      <div class="container">
        <h1>Форма заявки</h1>
        <form id="order-form" class="order-form" novalidate>
          <div class="form-field">
            <label for="name">Имя</label
            ><input id="name" name="name" type="text" />
            <p id="name-error" class="form-error"></p>
          </div>
          <div class="form-field">
            <label for="email">E-mail</label
            ><input id="email" name="email" type="email" />
            <p id="email-error" class="form-error"></p>
          </div>
          <div class="form-field">
            <label for="phone">Телефон</label
            ><input id="phone" name="phone" type="tel" />
            <p id="phone-error" class="form-error"></p>
          </div>
          <div class="form-field">
            <label for="comment">Комментарий</label
            ><textarea id="comment" name="comment" rows="4"></textarea>
          </div>
          <button class="button" type="submit">Подготовить заявку</button>
          <p id="success-message" class="success-message"></p>
        </form>
      </div>
    </main>
    <footer class="site-footer">
      <div class="container">Учебный проект</div>
    </footer>
  </body>
</html>
