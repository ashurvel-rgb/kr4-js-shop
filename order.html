<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Оформление заказа — Urban Set</title><link rel="stylesheet" href="css/style.css"><script type="module" src="js/main.js"></script><script type="module" src="js/validation.js"></script></head><body><header class="site-header"><div class="container header__inner"><a class="logo" href="index.html">URBAN SET</a><nav class="nav"><a href="catalog.html">Каталог</a><a href="contacts.html">Контакты</a><a href="cart.html">Корзина <span class="badge" data-cart-count>0</span></a><button class="theme-button" data-theme-toggle>◐</button></nav></div></header><main class="section"><div class="container"><p class="eyebrow">Финальный шаг</p><h1>Оформление заказа</h1><form class="panel form-grid" data-order-form novalidate><div class="field"><label for="name">Имя *</label><input id="name" name="name" autocomplete="name"><p class="field-error" data-error-for="name"></p></div><div class="field"><label for="email">E-mail *</label><input id="email" name="email" type="email" autocomplete="email"><p class="field-error" data-error-for="email"></p></div><div class="field"><label for="phone">Телефон *</label><input id="phone" name="phone" type="tel" placeholder="+7 999 000-00-00"><p class="field-error" data-error-for="phone"></p></div><div class="field"><label for="delivery">Доставка</label><select id="delivery" name="delivery"><option>Курьером</option><option>Самовывоз</option></select><p class="field-error" data-error-for="delivery"></p></div><div class="field field--wide"><label for="comment">Комментарий</label><textarea id="comment" name="comment" rows="4"></textarea><p class="field-error" data-error-for="comment"></p></div><div class="field field--wide"><label><input name="consent" type="checkbox" style="width:auto"> Согласен на обработку данных *</label><p class="field-error" data-error-for="consent"></p></div><button class="button" type="submit">Отправить заказ</button></form><p class="success" data-form-success hidden>Заказ принят! Мы свяжемся с вами для подтверждения.</p></div></main><footer class="site-footer"><div class="container">© 2026 Urban Set</div></footer></body></html>
